name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two pushes in a row used to run two deploys against the same box at the
# same time: `npm ci` from one overwrote node_modules while the other was
# building. Queue them instead of cancelling — a half-applied deploy is worse
# than a slow one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

      # Not a gate yet: the React Compiler rules that shipped with
      # eslint-config-next 16 flag 20 pre-existing errors across components
      # nobody has touched since. Making this blocking today would block every
      # deploy, so it reports and the backlog gets worked down separately.
      - name: Lint (report only)
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /var/www/livepoll
            # Remember where we were, so a failed build can be put back.
            PREV=$(git rev-parse HEAD)
            echo "$PREV" > /var/www/livepoll/.last-good-commit
            git pull origin main
            npm ci
            # The box has 1.6GB of RAM and Turbopack workers get OOM-killed
            # when `npm ci` and `next build` run back to back. Give the
            # allocator a moment and build on its own.
            sleep 5
            rm -rf .next
            if ! npm run build; then
              echo "Build failed — rolling back to $PREV"
              git reset --hard "$PREV"
              npm ci
              rm -rf .next
              npm run build
              pm2 reload livepoll --update-env
              exit 1
            fi
            pm2 reload livepoll --update-env || pm2 start ecosystem.config.js
            pm2 save

      - name: Health check
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://kvoroom.ru/ || echo 000)
            if [ "$code" = "200" ]; then echo "healthy (attempt $i)"; exit 0; fi
            echo "attempt $i: HTTP $code"
            sleep 10
          done
          echo "Site did not return 200 after deploy"
          exit 1
